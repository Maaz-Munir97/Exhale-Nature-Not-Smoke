# Calls the app every hour so it can send morning / evening reminders on time.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      e.g. https://exhale-nature-not-smoke.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET env var in Vercel
# Until both are added, the job skips quietly instead of failing.
name: Daily reminders

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger reminders
        if: env.APP_URL != '' && env.CRON_SECRET != ''
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/send-reminders"
